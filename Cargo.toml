[workspace]
resolver = "2"
members = ["crates/excel_unprotect"]

[workspace.package]
authors = ["dannycreations"]
edition = "2021"
license = "GPL"
repository = "https://github.com/dannycreations/Kani"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1"
clap = { version = "4.5.53", features = ["derive"] }
ctrlc = "3.5.1"
predicates = "3.1"
tempfile = "3.23.0"

[profile.dev]
codegen-units = 16
debug = 1
incremental = true

[profile.release]
codegen-units = 1
debug = "line-tables-only"
incremental = false
lto = true
opt-level = "z"
panic = "abort"
split-debuginfo = "packed"
